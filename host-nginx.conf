# 部署到宿主机 nginx：
#   sudo cp host-nginx.conf /etc/nginx/sites-available/blog.cogod.cn
#   sudo ln -sf /etc/nginx/sites-available/blog.cogod.cn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS 跳转，保留 certbot 续期验证路径
server {
    listen 80;
    server_name blog.cogod.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：处理 SSL，反代静态文件到容器，反代 Umami 到本机
server {
    listen 443 ssl http2;
    server_name blog.cogod.cn;

    ssl_certificate     /etc/letsencrypt/live/blog.cogod.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.cogod.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 静态文件反代到容器（docker compose 映射在 127.0.0.1:8080）
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Umami API proxy → pg query proxy on localhost:3002
    location /api/views/ {
        proxy_pass http://127.0.0.1:3002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Umami tracking script & dashboard
    location /umami/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
