# 部署到宿主机 nginx：
#   sudo cp host-nginx.conf /etc/nginx/sites-available/blog.cogod.cn
#   sudo ln -sf /etc/nginx/sites-available/blog.cogod.cn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# The readership endpoint is intentionally public data, but only this exact,
# read-only query is exposed. Rate limiting prevents it from being a general
# unauthenticated proxy into the local metrics service.
limit_req_zone $binary_remote_addr zone=blog_views:10m rate=30r/m;

# HTTP → HTTPS 跳转，保留 certbot 续期验证路径
server {
    listen 80;
    server_name blog.cogod.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：处理 SSL，反代静态文件到容器，反代 Umami 到本机
server {
    listen 443 ssl http2;
    server_name blog.cogod.cn;

    ssl_certificate     /etc/letsencrypt/live/blog.cogod.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.cogod.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    proxy_intercept_errors on;
    error_page 404 /404.html;

    # 静态文件反代到容器（docker compose 映射在 127.0.0.1:8080）
    location / {
        if ($uri ~ ^/.*[^/.]$) {
            return 301 $uri/$is_args$args;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Fixed, read-only readership query. Everything else under /api/views/ is denied.
    location = /api/views/websites/ceead9d3-35d9-4590-8678-d153328378a6/metrics {
        limit_req zone=blog_views burst=10 nodelay;
        limit_except GET { deny all; }
        valid_referers server_names;
        if ($invalid_referer) { return 403; }
        if ($arg_type != "url") { return 400; }
        if ($arg_startAt !~ "^[0-9]+$") { return 400; }
        if ($arg_endAt !~ "^[0-9]+$") { return 400; }
        proxy_pass http://127.0.0.1:3002/api/websites/ceead9d3-35d9-4590-8678-d153328378a6/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location ^~ /api/views/ {
        return 404;
    }

    # Umami tracking script & dashboard
    location /umami/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
