name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (incl. content schema validation)
        run: npx astro check
      - name: Build (fails on invalid frontmatter/schema)
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=20 \
              "$SERVER_USER@$SERVER_HOST" '
            set -euo pipefail
            cd ~/My-Blog
            fetch_ok=0
            for i in 1 2 3 4 5; do
              if git fetch origin; then fetch_ok=1; break; fi
              echo "git fetch failed (attempt $i), retrying in 5s..."
              sleep 5
            done
            [ "$fetch_ok" = 1 ] || { echo "git fetch failed after 5 attempts"; exit 1; }
            git reset --hard origin/main
            git log --oneline -1
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            docker compose ps
          '
