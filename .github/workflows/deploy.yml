name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 03:17 Asia/Shanghai (19:17 UTC on the preceding day).
    - cron: '17 19 * * *'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (incl. content schema validation)
        run: npx astro check
      - name: Build (fails on invalid frontmatter/schema)
        run: npm run build
      - name: Verify generated routes and asset budgets
        run: node scripts/verify-build.cjs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=20 \
              "$SERVER_USER@$SERVER_HOST" '
            set -euo pipefail
            cd ~/My-Blog
            fetch_ok=0
            for i in 1 2 3 4 5; do
              if git fetch origin; then fetch_ok=1; break; fi
              echo "git fetch failed (attempt $i), retrying in 5s..."
              sleep 5
            done
            [ "$fetch_ok" = 1 ] || { echo "git fetch failed after 5 attempts"; exit 1; }
            git reset --hard origin/main
            git log --oneline -1
            sudo -n true
            docker compose build --no-cache
            # The old container keeps serving until the new image builds.
            # Compose then replaces it only after a successful build.
            docker compose up -d --remove-orphans
            docker compose ps

            # Keep the host nginx config in lockstep with the repository.
            # Roll back the file if validation fails; the running nginx stays untouched.
            nginx_site=/etc/nginx/sites-available/blog.cogod.cn
            nginx_enabled=/etc/nginx/sites-enabled/blog.cogod.cn
            nginx_backup=$(mktemp)
            had_nginx_site=0
            if sudo -n test -f "$nginx_site"; then
              sudo -n cp "$nginx_site" "$nginx_backup"
              had_nginx_site=1
            fi
            if ! sudo -n install -m 0644 host-nginx.conf "$nginx_site" || \
               ! sudo -n ln -sfn "$nginx_site" "$nginx_enabled" || \
               ! sudo -n nginx -t; then
              if [ "$had_nginx_site" = 1 ]; then
                sudo -n install -m 0644 "$nginx_backup" "$nginx_site"
              else
                sudo -n rm -f "$nginx_site" "$nginx_enabled"
              fi
              rm -f "$nginx_backup"
              echo "nginx config validation failed; previous config restored"
              exit 1
            fi
            sudo -n systemctl reload nginx
            rm -f "$nginx_backup"
          '
