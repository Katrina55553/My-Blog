name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 03:17 Asia/Shanghai (19:17 UTC on the preceding day).
    - cron: '17 19 * * *'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (incl. content schema validation)
        run: npx astro check
      - name: Build (fails on invalid frontmatter/schema)
        run: npm run build
      - name: Verify generated routes and asset budgets
        run: node scripts/verify-build.cjs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A complete bundle lets the server fetch without reaching GitHub.
          fetch-depth: 0
      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          source_bundle="$RUNNER_TEMP/my-blog.bundle"
          remote_bundle="/tmp/my-blog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle"
          git bundle create "$source_bundle" HEAD
          git bundle verify "$source_bundle"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          ssh_options=(
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=60
            -o ServerAliveCountMax=20
          )
          scp "${ssh_options[@]}" "$source_bundle" "$SERVER_USER@$SERVER_HOST:$remote_bundle"
          ssh "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" \
              "bash -s -- '$remote_bundle' '$GITHUB_SHA'" <<'DEPLOY'
            set -euo pipefail
            source_bundle=$1
            expected_commit=$2
            trap 'rm -f "$source_bundle"' EXIT
            cd ~/My-Blog
            git bundle verify "$source_bundle"
            git fetch --no-tags "$source_bundle" HEAD
            actual_commit=$(git rev-parse FETCH_HEAD)
            if [ "$actual_commit" != "$expected_commit" ]; then
              echo "Deployment commit mismatch: expected $expected_commit, got $actual_commit"
              exit 1
            fi
            git update-ref refs/remotes/origin/main "$expected_commit"
            git reset --hard "$expected_commit"
            git log --oneline -1
            sudo -n true
            docker compose build --no-cache
            # The old container keeps serving until the new image builds.
            # Compose then replaces it only after a successful build.
            docker compose up -d --remove-orphans
            docker compose ps

            # Keep the host nginx config in lockstep with the repository.
            # Roll back the file if validation fails; the running nginx stays untouched.
            nginx_site=/etc/nginx/sites-available/blog.cogod.cn
            nginx_enabled=/etc/nginx/sites-enabled/blog.cogod.cn
            nginx_backup=$(mktemp)
            had_nginx_site=0
            if sudo -n test -f "$nginx_site"; then
              sudo -n cp "$nginx_site" "$nginx_backup"
              had_nginx_site=1
            fi
            if ! sudo -n install -m 0644 host-nginx.conf "$nginx_site" || \
               ! sudo -n ln -sfn "$nginx_site" "$nginx_enabled" || \
               ! sudo -n nginx -t; then
              if [ "$had_nginx_site" = 1 ]; then
                sudo -n install -m 0644 "$nginx_backup" "$nginx_site"
              else
                sudo -n rm -f "$nginx_site" "$nginx_enabled"
              fi
              rm -f "$nginx_backup"
              echo "nginx config validation failed; previous config restored"
              exit 1
            fi
            sudo -n systemctl reload nginx
            rm -f "$nginx_backup"
          DEPLOY
